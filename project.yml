name: ReadRocketPhonics
options:
  bundleIdPrefix: co.lorehex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    DEVELOPMENT_TEAM: HXN23BFRR2
    CODE_SIGN_STYLE: Automatic
targets:
  ReadRocketPhonics:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lorehex.readrocketphonics
        PRODUCT_NAME: ReadRocketPhonics
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Read Rocket Phonics
        CFBundleName: ReadRocketPhonics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
  ReadRocketPhonicsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ReadRocketTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lorehex.readrocketphonics.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReadRocketPhonics.app/ReadRocketPhonics"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ReadRocketPhonics
  ReadRocketPhonicsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ReadRocketUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.lorehex.readrocketphonics.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReadRocketPhonics
    dependencies:
      - target: ReadRocketPhonics
schemes:
  ReadRocketPhonics:
    build:
      targets:
        ReadRocketPhonics: all
        ReadRocketPhonicsTests: [test]
        ReadRocketPhonicsUITests: [test]
    test:
      targets:
        - ReadRocketPhonicsTests
        - ReadRocketPhonicsUITests
      gatherCoverageData: true
    run:
      config: Debug
